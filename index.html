<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AIEN 내부 자료</title>
<style>
:root{--bg:#AACBE1;--band:#134A86;--ink:#111;--accent:#2563A6}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:16px;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;background:var(--band);clip-path:polygon(0 80%,100% 40%,100% 100%,0 100%)}
form{position:relative;background:#fff;border-radius:18px;padding:36px 32px;width:min(420px,100%);box-shadow:0 18px 50px rgba(19,74,134,.25)}
.eyebrow{font-size:13px;color:#5a6b7d;margin:0 0 10px}
h1{font-size:24px;line-height:1.35;margin:0 0 24px}
h1 span{display:block;color:var(--accent)}
label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid #c9d6e3;border-radius:10px;letter-spacing:.04em}
input:focus{outline:none;border-color:var(--accent)}
button{margin-top:14px;width:100%;font:inherit;font-size:16px;font-weight:700;padding:13px;border:0;border-radius:10px;background:var(--band);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#msg{min-height:22px;margin:12px 0 0;font-size:14px;color:#5a6b7d}
#msg.err{color:#c0392b}
</style>
</head>
<body>
<form id="gate" autocomplete="off">
  <p class="eyebrow">2026 AI 혁신 과제 · 콘텐츠 개발 파트 · 내부 검토용</p>
  <h1>강의 현지화 도구:<span>아바타 캐릭터 구독 비교</span></h1>
  <label for="code">접속 코드</label>
  <input id="code" type="password" required autofocus>
  <button id="go" type="submit">열기</button>
  <p id="msg" role="status"></p>
</form>
<script>
const SALT = Uint8Array.from(atob("FVef2aMir72iFUyyaUYoCQ=="), c => c.charCodeAt(0));
const ITER = 600000;
const $ = id => document.getElementById(id);

async function keyFor(code) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt: SALT, iterations: ITER, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
}
async function open1(key, name) {
  const r = await fetch("files/" + name);
  if (!r.ok) throw new Error("fetch " + name);
  const buf = new Uint8Array(await r.arrayBuffer());
  return crypto.subtle.decrypt({name: "AES-GCM", iv: buf.slice(0, 12)}, key, buf.slice(12));
}

async function unlock(code) {
  const key = await keyFor(code);
  let list;
  try { list = JSON.parse(new TextDecoder().decode(await open1(key, "list.bin"))); }
  catch (e) { if (e.name === "OperationError") return false; throw e; }
  let html = new TextDecoder().decode(await open1(key, "page.bin"));
  let done = 0;
  const urls = await Promise.all(list.map(async it => {
    const blob = new Blob([await open1(key, it.f)], {type: it.t});
    $("msg").textContent = `자료를 여는 중… ${++done}/${list.length}`;
    return [it.p, URL.createObjectURL(blob)];
  }));
  for (const [p, u] of urls) {
    if (p.startsWith("media/")) html = html.split(p).join(u);
    else html = html.split(`href="${p}"`).join(`href="${u}" download="${p}"`);
  }
  try { sessionStorage.setItem("aien-code", code); } catch (e) {}
  document.open(); document.write(html); document.close();
  return true;
}

async function run(code, quiet) {
  $("go").disabled = true; $("msg").className = ""; $("msg").textContent = "확인 중…";
  try {
    if (await unlock(code)) return;
    $("msg").className = "err"; $("msg").textContent = quiet ? "" : "접속 코드가 맞지 않습니다.";
  } catch (e) {
    $("msg").className = "err"; $("msg").textContent = "자료를 불러오지 못했습니다. 새로고침해 주세요.";
  }
  $("go").disabled = false; $("code").select();
}

$("gate").addEventListener("submit", e => { e.preventDefault(); run($("code").value.trim(), false); });
let saved = null;
try { saved = sessionStorage.getItem("aien-code"); } catch (e) {}
if (saved) run(saved, true);
</script>
</body>
</html>
